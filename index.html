<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Exam Practice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ap-green:#00703c;--ap-dark:#1a1a1a;--ap-gray:#f5f5f5;--ap-border:#ddd;--ap-text:#333;--ap-white:#fff;--ap-blue:#0066cc;--ap-red:#cc0000;--ap-orange:#e67e00;--sidebar-w:260px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--ap-gray);color:var(--ap-text);min-height:100vh}
/* HEADER */
.header{background:var(--ap-dark);color:var(--ap-white);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:fixed;top:0;left:0;right:0;z-index:100}
.header .logo{font-weight:700;font-size:18px;letter-spacing:-.5px}
.header .logo span{color:var(--ap-green)}
.header .exam-info{font-size:14px;opacity:.8}
.header .timer{background:var(--ap-green);color:var(--ap-white);padding:6px 16px;border-radius:4px;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.header .timer.warning{background:var(--ap-orange)}
.header .timer.danger{background:var(--ap-red)}
.header-actions{display:flex;align-items:center;gap:12px}
.btn{padding:8px 20px;border:none;border-radius:4px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--ap-green);color:var(--ap-white)}
.btn-primary:hover{background:#005a30}
.btn-secondary{background:transparent;color:var(--ap-white);border:1px solid rgba(255,255,255,.3)}
.btn-secondary:hover{border-color:var(--ap-white)}
.btn-outline{background:transparent;color:var(--ap-green);border:2px solid var(--ap-green)}
.btn-outline:hover{background:var(--ap-green);color:var(--ap-white)}
.btn-danger{background:var(--ap-red);color:var(--ap-white)}
.btn-sm{padding:5px 12px;font-size:12px}
/* SIDEBAR */
.sidebar{position:fixed;top:56px;left:0;width:var(--sidebar-w);height:calc(100vh - 56px);background:var(--ap-white);border-right:1px solid var(--ap-border);overflow-y:auto;z-index:50;padding:16px}
.sidebar h3{font-size:13px;text-transform:uppercase;color:#666;margin-bottom:12px;letter-spacing:.5px}
.q-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.q-btn{width:100%;aspect-ratio:1;border:1px solid var(--ap-border);background:var(--ap-white);border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative}
.q-btn:hover{border-color:var(--ap-green)}
.q-btn.active{background:var(--ap-green);color:var(--ap-white);border-color:var(--ap-green)}
.q-btn.answered{background:#e8f5e9;border-color:var(--ap-green);color:var(--ap-green)}
.q-btn.flagged::after{content:'';position:absolute;top:2px;right:2px;width:6px;height:6px;background:var(--ap-orange);border-radius:50%}
.sidebar-stats{margin-top:16px;padding-top:16px;border-top:1px solid var(--ap-border);font-size:13px;color:#666}
.sidebar-stats div{margin-bottom:4px}
.sidebar-stats span{font-weight:600;color:var(--ap-text)}
/* MAIN CONTENT */
.main{margin-left:var(--sidebar-w);margin-top:56px;padding:32px 48px;max-width:900px}
.main.no-sidebar{margin-left:0;max-width:100%}
/* LANDING PAGE */
.landing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 56px);text-align:center;margin-left:0;padding:48px}
.landing h1{font-size:36px;margin-bottom:8px}
.landing .subtitle{font-size:18px;color:#666;margin-bottom:48px}
.exam-cards{display:flex;gap:32px;flex-wrap:wrap;justify-content:center}
.exam-card{background:var(--ap-white);border:2px solid var(--ap-border);border-radius:12px;padding:40px 32px;width:340px;cursor:pointer;transition:all .2s}
.exam-card:hover{border-color:var(--ap-green);box-shadow:0 4px 20px rgba(0,112,60,.15)}
.exam-card h2{font-size:22px;margin-bottom:8px}
.exam-card p{color:#666;font-size:14px;margin-bottom:20px}
.exam-card .meta{display:flex;gap:16px;justify-content:center;font-size:13px;color:#888}
.exam-card .meta div{display:flex;align-items:center;gap:4px}
/* QUESTION */
.question-container{background:var(--ap-white);border-radius:8px;padding:32px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.question-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.question-num{font-size:14px;font-weight:600;color:#666}
.flag-btn{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--ap-border);border-radius:4px;padding:6px 12px;font-size:13px;cursor:pointer;color:#666;transition:all .15s}
.flag-btn:hover,.flag-btn.flagged{border-color:var(--ap-orange);color:var(--ap-orange)}
.flag-btn.flagged{background:#fff8e1}
.question-text{font-size:16px;line-height:1.6;margin-bottom:24px}
.question-text table{border-collapse:collapse;margin:12px 0}
.question-text table td,.question-text table th{border:1px solid var(--ap-border);padding:8px 16px;text-align:center}
.question-text table th{background:var(--ap-gray);font-weight:600}
.stimulus{background:var(--ap-gray);border-left:3px solid var(--ap-green);padding:16px 20px;margin-bottom:20px;font-size:14px;line-height:1.6;border-radius:0 4px 4px 0}
.choices{list-style:none}
.choices li{padding:12px 16px;margin-bottom:8px;border:2px solid var(--ap-border);border-radius:6px;cursor:pointer;transition:all .15s;font-size:15px;display:flex;align-items:flex-start;gap:12px}
.choices li:hover{border-color:var(--ap-blue);background:#f0f7ff}
.choices li.selected{border-color:var(--ap-green);background:#e8f5e9}
.choices li .choice-letter{font-weight:700;min-width:20px;color:#666}
.choices li.selected .choice-letter{color:var(--ap-green)}
/* NAV BUTTONS */
.nav-buttons{display:flex;justify-content:space-between;margin-top:24px}
/* FRQ */
.frq-container{background:var(--ap-white);border-radius:8px;padding:32px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.frq-text{font-size:15px;line-height:1.7;margin-bottom:24px;white-space:pre-line}
.frq-textarea{width:100%;min-height:200px;border:2px solid var(--ap-border);border-radius:6px;padding:16px;font-size:15px;font-family:inherit;line-height:1.6;resize:vertical}
.frq-textarea:focus{outline:none;border-color:var(--ap-green)}
.frq-part{margin-bottom:32px}
.frq-part h4{font-size:14px;font-weight:600;margin-bottom:8px;color:var(--ap-green)}
/* SCORING PAGE */
.scoring-section{background:var(--ap-white);border-radius:8px;padding:32px;margin-bottom:24px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.scoring-section h3{font-size:18px;margin-bottom:16px}
.rubric-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--ap-gray)}
.rubric-item:last-child{border:none}
.rubric-item label{font-size:14px;line-height:1.5;cursor:pointer;flex:1}
.rubric-item input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--ap-green)}
.points-display{font-size:14px;font-weight:600;color:var(--ap-green);min-width:50px;text-align:right}
.score-input{width:60px;padding:6px;font-size:16px;font-weight:600;text-align:center;border:2px solid var(--ap-border);border-radius:4px}
.score-input:focus{outline:none;border-color:var(--ap-green)}
/* RESULTS */
.results-page{text-align:center;padding:48px 24px}
.results-page.main{max-width:700px;margin:56px auto 0}
.score-circle{width:160px;height:160px;border-radius:50%;background:var(--ap-green);color:var(--ap-white);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:32px auto}
.score-circle .big-num{font-size:64px;font-weight:800;line-height:1}
.score-circle .label{font-size:14px;opacity:.8}
.breakdown{background:var(--ap-white);border-radius:8px;padding:24px;margin:32px 0;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.breakdown h3{margin-bottom:16px;font-size:18px}
.breakdown-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ap-gray)}
.breakdown-row:last-child{border:none;font-weight:700}
.progress-bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-top:4px}
.progress-bar .fill{height:100%;background:var(--ap-green);border-radius:4px;transition:width .5s}
/* SECTION TRANSITION */
.section-transition{text-align:center;padding:80px 48px}
.section-transition h2{font-size:28px;margin-bottom:12px}
.section-transition p{color:#666;font-size:16px;margin-bottom:32px;max-width:600px;margin-left:auto;margin-right:auto;line-height:1.6}
/* REVIEW PAGE */
.review-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:20px 0}
.review-item{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:2px solid var(--ap-border);border-radius:4px;font-size:12px;font-weight:600;cursor:pointer}
.review-item.answered{background:#e8f5e9;border-color:var(--ap-green);color:var(--ap-green)}
.review-item.unanswered{background:#fff3e0;border-color:var(--ap-orange);color:var(--ap-orange)}
.review-item.flagged{border-color:var(--ap-orange);position:relative}
.review-item.correct{background:#e8f5e9;border-color:var(--ap-green);color:var(--ap-green)}
.review-item.incorrect{background:#ffebee;border-color:var(--ap-red);color:var(--ap-red)}
.legend{display:flex;gap:20px;justify-content:center;margin:16px 0;font-size:13px}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:12px;height:12px;border-radius:3px;border:2px solid}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--ap-white);border-radius:12px;padding:32px;max-width:480px;width:90%;text-align:center}
.modal h3{font-size:20px;margin-bottom:12px}
.modal p{color:#666;margin-bottom:24px}
.modal-actions{display:flex;gap:12px;justify-content:center}
.hidden{display:none!important}
/* Responsive */
@media(max-width:768px){
.sidebar{display:none}
.main{margin-left:0;padding:20px 16px}
}
</style>
</head>
<body>

<div id="app"></div>

<script>
// ===== QUESTION DATA =====
const MACRO_MC = [
{q:"When an economy operates inside its production possibilities curve, it can increase production of one good",choices:["at zero opportunity cost in terms of the other good","only with an increase in unemployment","only with an increase in the price level","only with an increase in technology","only if the labor force increases"],answer:0},
{q:"If people save 10 percent of each additional dollar received in income, which of the following is true?",choices:["The marginal propensity to consume is less than the marginal propensity to save.","The marginal propensity to consume increases as income increases.","The marginal propensity to consume is 0.1, and the maximum value of the tax multiplier is \u22121.","The marginal propensity to consume equals the marginal propensity to save.","The marginal propensity to consume is 0.9, and the maximum value of the spending multiplier is 10."],answer:4},
{q:"An increase in spending on capital goods will most likely lead to which of the following in the long run?",choices:["An increase in government spending","An increase in long-run aggregate supply","An increase in consumption spending due to crowding out","A decrease in employment","A decrease in economic growth"],answer:1},
{q:"The real interest rate can remain constant if an increase in transfer payments is accompanied by",choices:["a decrease in government purchases","a decrease in income tax rates","an increase in reserve requirements","an open-market sale of bonds","a decrease in private savings"],answer:0},
{q:"Suppose the only revenue taken in by the government is in the form of income taxes and the tax rate is 10 percent. If national income is $900 billion and government expenditures plus transfers are $120 billion, which of the following is true about the government budget?",choices:["The government budget has a surplus of $780 billion.","The government budget has a surplus of $120 billion.","The government budget is balanced.","The government budget has a deficit of $90 billion.","The government budget has a deficit of $30 billion."],answer:4},
{q:"One reason the aggregate demand curve is downward-sloping is that as the price level increases,",choices:["the purchasing power of assets decreases","imports decrease","the demand for the domestic currency on the foreign exchange market increases","interest-sensitive expenditures increase","the public feels richer and spends more"],answer:0},
{q:'The table shows the time required to produce one crane or one truck in the United States and Thailand. The United States and Thailand have the same amount of resources.<br><table><tr><th></th><th>1 Crane</th><th>1 Truck</th></tr><tr><td>United States</td><td>50 hours</td><td>25 hours</td></tr><tr><td>Thailand</td><td>20 hours</td><td>30 hours</td></tr></table>Which of the following can be accurately concluded from the data?',choices:["The United States has a comparative advantage in producing cranes, and Thailand has a comparative advantage in producing trucks.","Thailand has a comparative advantage in producing cranes, and the United States has a comparative advantage in producing trucks.","Thailand has a comparative advantage in producing both cranes and trucks.","The United States has a comparative advantage in producing both cranes and trucks.","Neither country has a comparative advantage in producing cranes and trucks."],answer:1},
{q:"All of the following concepts can be illustrated using the production possibilities curve model EXCEPT",choices:["unemployment","inflation","opportunity cost","choice","scarcity"],answer:1},
{q:"An expansionary monetary policy is intended to eliminate which type of unemployment?",choices:["Frictional","Cyclical","Structural","Seasonal","Natural"],answer:1},
{q:"Based on the graph provided, which segment represents only the expansionary phase of the business cycle?",choices:["RS","ST","SU","TV","VW"],answer:3},
{q:"Which of the following correctly describes spending in a circular flow model?",choices:["Households hire resources from producers in resource markets.","Households purchase goods and services from producers in product markets.","Households purchase goods and services from producers in resource markets.","Producers hire resources from households in product markets.","Producers sell resources to households in product markets."],answer:1},
{q:"If some unemployed individuals become discouraged and stop looking for employment, which of the following will occur in the short run?",choices:["The unemployment rate will increase.","The unemployment rate will decrease.","The labor force will increase.","Real output will increase.","The labor force participation rate will increase."],answer:1},
{q:"Which of the following would NOT be included in the gross domestic product of the United States in 2018?",choices:["The value of computers produced in the United States in 2018 but not sold","The value of cars produced in the United States in 2018 by a Japanese motor company","The value of cars produced in Japan in 2018 by a United States motor company","The amount a patient paid to a dentist for dental services completed in 2018 in the United States","The value of a restaurant meal purchased by a Japanese tourist in 2018 in the United States"],answer:2},
{q:"Which of the following individuals benefits from unexpected inflation?",choices:["A retiree living on a fixed pension","A landlord receiving fixed lease payments","A student saving $10 each month in a piggy bank","A creditor lending out $1,000 as a fixed-rate loan","A debtor making payments on existing fixed-rate loans"],answer:4},
{q:"Frictional unemployment may be caused by",choices:["people losing jobs when their skills become obsolete","people quitting jobs to look for better jobs","people dropping out of the job market after a considerable search","a general downturn in economic activity","a decrease in aggregate supply"],answer:1},
{q:'Country X has the following macroeconomic statistics.<br><table><tr><th>Real Output (Billions $)</th><th>Unemployment Rate (%)</th></tr><tr><td>110</td><td>1</td></tr><tr><td>108</td><td>2</td></tr><tr><td>106</td><td>3</td></tr><tr><td>104</td><td>4</td></tr><tr><td>102</td><td>5</td></tr><tr><td>100</td><td>6</td></tr><tr><td>98</td><td>7</td></tr></table>Suppose the current cyclical unemployment rate is 2%, the frictional unemployment rate is 4%, and the structural unemployment rate is 1%. What is the full-employment level of real output?',choices:["$100 billion","$102 billion","$104 billion","$106 billion","$110 billion"],answer:1},
{q:'The table shows the end-of-year consumer price index (CPI) for an economy.<br><table><tr><th>Year</th><th>CPI</th></tr><tr><td>2008</td><td>80</td></tr><tr><td>2009</td><td>100</td></tr><tr><td>2010</td><td>105</td></tr></table>Which of the following statements is true based on the information given?',choices:["The inflation rate in 2009 was 20 percent.","The base year for the price index is 2008.","The inflation rate was higher in 2010 than in 2009.","The inflation rate in 2010 was 5 percent.","Prices of all products rose in 2009 and 2010."],answer:3},
{q:"One limitation of using real GDP to measure a nation\u2019s economic performance is that",choices:["real GDP does not account for inflation","real GDP does not count final goods","real GDP estimates an economy\u2019s potential, not its actual performance","real GDP does not account for nonmarket transactions","real GDP understates the rate of unemployment"],answer:3},
{q:"Real gross domestic product is equal to which of the following?",choices:["Real wages of households","Real income plus government transfer payments","Nominal output adjusted for price-level changes","Nominal output less depreciation","Changes in the standard of living"],answer:2},
{q:'Based on the data in the table, what is true about the market for pizza if the current market price is $10?<br><table><tr><th>Price</th><th>Quantity Demanded</th><th>Quantity Supplied</th></tr><tr><td>$5</td><td>140</td><td>20</td></tr><tr><td>$10</td><td>120</td><td>40</td></tr><tr><td>$15</td><td>100</td><td>60</td></tr><tr><td>$20</td><td>80</td><td>80</td></tr><tr><td>$25</td><td>60</td><td>100</td></tr></table>',choices:["The supply curve will shift to the left.","The demand curve will shift to the right.","The market price for pizza will decrease.","There is a shortage of 80 units.","There is a surplus of 160 units."],answer:3},
{q:"In the short run, a contractionary fiscal policy will",choices:["shift the aggregate demand curve to the left","shift the short-run aggregate supply curve to the right","increase the money supply","increase the demand for loanable funds","increase the government budget deficit"],answer:0},
{q:"A reduction in aggregate demand will necessarily cause an increase in unemployment in the short run when",choices:["nominal wages or prices are sticky downward","nominal wages and prices are flexible","the aggregate supply curve is vertical","the money supply grows at a constant rate","imports exceed exports"],answer:0},
{q:"A decrease in nominal wages will cause the",choices:["price level to increase","real output to remain the same","long-run aggregate supply curve to shift to the left","short-run aggregate supply curve to shift to the right","aggregate demand curve to shift to the right"],answer:3},
{q:"With an upward-sloping aggregate supply curve, an increase in government transfer payments will most likely",choices:["reduce the price level","reduce the level of nominal gross domestic product","increase real gross domestic product in the short run","shift the short-run aggregate supply curve to the right","shift both the aggregate demand curve and the long-run aggregate supply curve to the left"],answer:2},
{q:"With an upward-sloping aggregate supply curve, an increase in government transfer payments will most likely",choices:["reduce the price level","reduce the level of nominal gross domestic product","increase real gross domestic product in the short run","shift the short-run aggregate supply curve to the right","shift both the aggregate demand curve and the long-run aggregate supply curve to the left"],answer:2},
{q:"Which of the following is an example of an automatic stabilizer that is contractionary?",choices:["A government-legislated increase in the marginal income tax rate","Bond purchases by the nation\u2019s central bank","An increase in transfer payments","An increase in tax revenues as GDP increases","An increase in unemployment compensation"],answer:3},
{q:"Which of the following correctly describes an effective fiscal policy action to close an inflationary gap?",choices:["Decreasing taxes, which will increase aggregate demand","Increasing taxes, which will increase aggregate demand","Increasing government spending, which will decrease private investment","Increasing government spending, which will decrease interest rates","Decreasing government spending, which will decrease aggregate demand"],answer:4},
{q:"Assume that an economy is currently in a recession. If policy-makers do nothing and wages and prices are flexible, which of the following will occur in the long run?",choices:["The short-run aggregate supply curve will shift to the right, leading to full employment.","The short-run aggregate supply curve will shift to the left, leading to full employment.","The aggregate demand curve will shift to the right, leading to full employment.","The aggregate demand curve will shift to the left, leading to full employment.","The unemployment rate will continue to increase."],answer:0},
{q:"If there is no crowding out, a $10 billion increase in investment in physical capital will most likely lead to a",choices:["less than $10 billion increase in aggregate supply","more than $10 billion increase in aggregate demand","$10 billion increase in aggregate demand","$10 billion increase in aggregate supply","$10 billion increase in the money supply"],answer:1},
{q:"Which of the following will cause an increase in the price level in the short run?",choices:["A rightward shift in the aggregate demand curve","A rightward shift in the short-run aggregate supply curve","A rightward shift in the long-run aggregate supply curve","An increase in savings","An increase in imports"],answer:0},
{q:"What is the most likely short-run effect of an increase in the price of oil, a key input for production?",choices:["An increase in long-run aggregate supply","Demand-pull inflation","A reduction in the unemployment rate","An increase in real gross domestic product","Cost-push inflation"],answer:4},
{q:"Assume the economy is currently in short-run equilibrium at point D, as shown in the graph provided, and that the banking system has limited reserves. Which of the following is a monetary policy action that would restore long-run equilibrium?",choices:["An open-market purchase of government bonds, which would move the economy to point C","An open-market sale of government bonds, which would move the economy to point A","An increase in the required reserve ratio, which would move the economy to point C","An increase in government spending, which would move the economy to point C","An increase in taxes, which would move the economy to point A"],answer:1},
{q:"Assume Bank A has the following balance sheet. If the required reserve ratio is 25 percent, what is the maximum amount by which Bank A can increase its loans?",choices:["$0","$25,000","$50,000","$100,000","$150,000"],answer:1},
{q:"Assume that the required reserve ratio is 10 percent and the banking system has limited reserves. If the central bank buys $1,000 of bonds from commercial banks, which of the following will occur?",choices:["The money supply will increase by a maximum of $1,000.","There will be a maximum of $9,000 of new loans made by all banks.","Demand deposits will increase by a maximum of $9,000.","The amount of new cash reserves injected into the banking system will be $100.","The money supply will increase by a maximum of $10,000."],answer:4},
{q:"Which of the following is counted in the M2 measure, but not the M1 measure, of the United States money supply?",choices:["Savings accounts","Currency","Stocks","Small time deposits","Checkable deposits"],answer:3},
{q:"An increase in the real interest rate will most likely affect private investment in plant and equipment and the quantity of personal savings in which of the following ways?",choices:["Private investment will increase, and personal savings will increase.","Private investment will increase, and personal savings will decrease.","Private investment will decrease, and personal savings will increase.","Private investment will decrease, and personal savings will not change.","Private investment will not change, and personal savings will decrease."],answer:2},
{q:"Assume the banking system in a nation has limited reserves. Following an unanticipated increase in the money supply, the price level and real output will change in which of the following ways in the short run?",choices:["The price level will increase, and real output will increase.","The price level will increase, and real output will decrease.","The price level will increase, and real output will not change.","The price level will not change, and real output will not change.","The price level will decrease, and real output will increase."],answer:0},
{q:"Assume firms increase their borrowing in order to expand capacity. How will this additional borrowing affect the loanable funds market?",choices:["The supply of loanable funds curve will shift to the left.","The supply of loanable funds curve will shift to the right.","The demand for loanable funds curve will shift to the left.","The demand for loanable funds curve will shift to the right.","The loanable funds market will not be affected."],answer:3},
{q:"Which of the following is an example of a contractionary monetary policy action by a central bank?",choices:["Increasing interest on reserves","Buying government securities on the open market","Decreasing government spending","Increasing business taxes","Decreasing the policy rate"],answer:0},
{q:"Assume the banking system in a nation has limited reserves. When the central bank increases the required reserve ratio, a commercial bank\u2019s",choices:["excess reserves remain unchanged","excess reserves increase","excess reserves decrease","required reserves decrease","required reserves remain unchanged"],answer:2},
{q:"Which of the following policy actions will offset the effect of a decrease in investment in plant and equipment on aggregate demand in the short run in the United States?",choices:["An open-market sale of government bonds","An increase in marginal income taxes","An increase in the required reserve ratio","A decrease in government spending","A decrease in interest on reserves"],answer:4},
{q:"An increase in real income will cause which of the following to occur in the short run?",choices:["Imports will decrease.","Consumption spending will decrease.","Nominal interest rates will decrease.","The monetary base will increase.","Money demand will increase."],answer:4},

{title:"FRQ 3 (5 points)",text:"3. The provided graph shows cost, revenue, and demand curves for a single-price monopolist that sells leather shoes. The fixed cost is zero, and the marginal cost is constant.\n(a) Identify the monopolist’s profit-maximizing quantity and price.\n(b) Calculate the monopolist’s economic profit at the profit-maximizing quantity. Show your work.\n(c) If the monopolist decides to produce 10 additional units beyond the profit-maximizing quantity identified in part (a), would total revenue increase, decrease, or remain the same? Explain.\n(d) Suppose the government breaks up the monopoly, resulting in a perfectly competitive market for leather shoes.\n  i. Identify the new equilibrium quantity and price.\n  ii. Calculate the total economic surplus. Show your work.",maxPoints:5,rubric:[{part:"(a)",desc:"Profit-maximizing quantity where MR=MC; price from demand curve at that quantity (read from graph)",pts:1},{part:"(b)",desc:"Economic profit = (Price - ATC) x Quantity, or (Price - MC) x Quantity since FC=0 and MC is constant (calculate from graph values)",pts:1},{part:"(c)",desc:"Total revenue would increase; at 10 additional units beyond profit-max Q, MR is still positive (above zero), so producing more increases TR",pts:1},{part:"(d)(i)",desc:"New equilibrium where supply (MC) meets demand; higher quantity and lower price than monopoly outcome",pts:1},{part:"(d)(ii)",desc:"Total economic surplus = 1/2 x (demand intercept price - MC) x competitive quantity (full triangle under demand above MC)",pts:1}]}

// ===== APP STATE =====
let state = {
  screen: 'landing', // landing, mc, mc-review, frq-transition, frq, frq-scoring, results
  exam: null, // 'macro', 'micro', 'macro23', 'micro23', 'physics1_2017', or 'physics1_2014'
  currentQ: 0,
  mcAnswers: {},
  mcFlags: {},
  frqAnswers: {},
  frqScores: {},
  timerSeconds: 0,
  timerInterval: null,
  timerRunning: false
};

function getQuestions() {
  switch(state.exam) {
    case 'macro': return MACRO_MC;
    case 'micro': return MICRO_MC;
    case 'macro23': return MACRO_2023_MC;
    case 'micro23': return MICRO_2023_MC;
    case 'physics1_2017': return PHYSICS1_2017_MC;
    case 'physics1_2014': return PHYSICS1_2014_MC;
    default: return [];
  }
}
function getFRQs() {
  switch(state.exam) {
    case 'macro': return MACRO_FRQ;
    case 'micro': return MICRO_FRQ;
    case 'macro23': return MACRO_2023_FRQ;
    case 'micro23': return MICRO_2023_FRQ;
    default: return [];
  }
}
function hasFRQ() { return state.exam === 'macro' || state.exam === 'micro' || state.exam === 'macro23' || state.exam === 'micro23'; }
function getExamName() {
  switch(state.exam) {
    case 'macro': return 'AP Macroeconomics';
    case 'micro': return 'AP Microeconomics';
    case 'macro23': return 'AP Macroeconomics';
    case 'micro23': return 'AP Microeconomics';
    case 'physics1_2017': return 'AP Physics 1';
    case 'physics1_2014': return 'AP Physics 1';
    default: return 'AP Exam';
  }
}
function getExamYear() {
  if (state.exam === 'macro23' || state.exam === 'micro23') return '2023';
  if (state.exam === 'physics1_2017') return '2017';
  if (state.exam === 'physics1_2014') return '2014';
  return '2022';
}
const LETTERS = ['A','B','C','D','E'];

// ===== TIMER =====
function startTimer(minutes) {
  state.timerSeconds = minutes * 60;
  state.timerRunning = true;
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    if (state.timerSeconds > 0) {
      state.timerSeconds--;
      updateTimerDisplay();
    } else {
      clearInterval(state.timerInterval);
      state.timerRunning = false;
    }
  }, 1000);
}
function stopTimer() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerRunning = false;
}
function updateTimerDisplay() {
  const el = document.getElementById('timer');
  if (!el) return;
  const m = Math.floor(state.timerSeconds / 60);
  const s = state.timerSeconds % 60;
  el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  el.className = 'timer';
  if (state.timerSeconds < 300) el.classList.add('danger');
  else if (state.timerSeconds < 600) el.classList.add('warning');
}

// ===== RENDER =====
function render() {
  const app = document.getElementById('app');
  switch(state.screen) {
    case 'landing': app.innerHTML = renderLanding(); break;
    case 'mc': app.innerHTML = renderMC(); break;
    case 'mc-review': app.innerHTML = renderMCReview(); break;
    case 'frq-transition': app.innerHTML = renderFRQTransition(); break;
    case 'frq': app.innerHTML = renderFRQ(); break;
    case 'frq-scoring': app.innerHTML = renderFRQScoring(); break;
    case 'results': app.innerHTML = renderResults(); break;
  }
  if (state.screen === 'mc') updateTimerDisplay();
}

function renderMC() {
  const qs = getQuestions();
  const q = qs[state.currentQ];
  const answered = qs.filter((question, i) => question.multi ? Array.isArray(state.mcAnswers[i]) && state.mcAnswers[i].length === 2 : state.mcAnswers[i] !== undefined).length;
  const flagged = state.mcFlags[state.currentQ] || false;
  const selected = state.mcAnswers[state.currentQ];

  let sidebar = `<div class="sidebar"><h3>Questions</h3><div class="q-grid">`;
  for (let i = 0; i < qs.length; i++) {
    let cls = 'q-btn';
    const isAnswered = qs[i].multi ? Array.isArray(state.mcAnswers[i]) && state.mcAnswers[i].length === 2 : state.mcAnswers[i] !== undefined;
    if (i === state.currentQ) cls += ' active';
    else if (isAnswered) cls += ' answered';
    if (state.mcFlags[i]) cls += ' flagged';
    sidebar += `<button class="${cls}" onclick="goToQ(${i})">${i+1}</button>`;
  }
  sidebar += `</div><div class="sidebar-stats"><div>Answered: <span>${answered}</span> / ${qs.length}</div><div>Flagged: <span>${Object.values(state.mcFlags).filter(Boolean).length}</span></div></div></div>`;

  let choices = '<ul class="choices">';
  q.choices.forEach((c, i) => {
    const isSelected = q.multi ? Array.isArray(selected) && selected.includes(i) : selected === i;
    const sel = isSelected ? ' selected' : '';
    const indicator = q.multi ? (isSelected ? '☑' : '☐') : LETTERS[i];
    const choiceText = q.multi ? `<strong>${LETTERS[i]}.</strong> ${c}` : c;
    choices += `<li class="${sel}" onclick="selectAnswer(${i})"><span class="choice-letter">${indicator}</span><span>${choiceText}</span></li>`;
  });
  choices += '</ul>';

  return `
  <div class="header">
    <div class="logo"><span>AP</span> ${getExamName()}</div>
    <div class="exam-info">Section I: Multiple Choice</div>
    <div class="header-actions">
      <div id="timer" class="timer">${hasFRQ() ? '70:00' : '90:00'}</div>
    </div>
  </div>
  ${sidebar}
  <div class="main">
    <div class="question-container">
      <div class="question-header">
        <span class="question-num">Question ${state.currentQ + 1} of ${qs.length}</span>
        <button class="flag-btn ${flagged ? 'flagged' : ''}" onclick="toggleFlag()">
          ${flagged ? '⚑ Flagged' : '⚐ Flag for Review'}
        </button>
      </div>
      <div class="question-text">${q.q}</div>
      ${q.multi ? '<p style="font-size:14px;color:#666;margin-bottom:12px">Select two answers.</p>' : ''}
      ${choices}
    </div>
    <div class="nav-buttons">
      <button class="btn btn-outline" onclick="prevQ()" ${state.currentQ === 0 ? 'disabled style="opacity:.4;pointer-events:none"' : ''}>← Previous</button>
      ${state.currentQ === qs.length - 1
        ? `<button class="btn btn-primary" onclick="reviewMC()">Review Answers →</button>`
        : `<button class="btn btn-primary" onclick="nextQ()">Next →</button>`}
    </div>
  </div>`;
}

    sections += `

      <h3>${frq.title}</h3>
      <p style="color:#666;margin-bottom:16px">Check each criterion you believe you met in your response:</p>

  });

  return `

function renderResults() {
  stopTimer();
  const qs = getQuestions();
  const frqs = getFRQs();

  let mcCorrect = 0;
  qs.forEach((q, i) => {
    if (q.multi) {
      const userAnswer = state.mcAnswers[i] || [];
      const correctAnswer = q.answer;
      if (Array.isArray(userAnswer) && userAnswer.length === correctAnswer.length && [...userAnswer].sort().every((v, j) => v === [...correctAnswer].sort()[j])) {
        mcCorrect++;
      }
    } else {
      if (state.mcAnswers[i] === q.answer) mcCorrect++;
    }
  });

  let frqPoints = 0;
  frqs.forEach((frq, fi) => {
    frq.rubric.forEach((r, ri) => {
      if (state.frqScores[`${state.exam}_${fi}_${ri}`]) frqPoints += r.pts;
    });
  });

  const totalMC = qs.length;
  const mcWeighted = (mcCorrect / totalMC) * (hasFRQ() ? 53.33 : 80);
  const frqWeighted = hasFRQ() ? (frqPoints / 20) * 26.67 : 0;
  const composite = hasFRQ() ? (mcWeighted + frqWeighted) : mcWeighted;

  let apScore;
  if (composite >= 60) apScore = 5;
  else if (composite >= 47) apScore = 4;
  else if (composite >= 35) apScore = 3;
  else if (composite >= 25) apScore = 2;
  else apScore = 1;

  const qualLabels = {5:'Extremely well qualified',4:'Well qualified',3:'Qualified',2:'Possibly qualified',1:'No recommendation'};

  let mcGrid = '<div class="review-grid" style="grid-template-columns:repeat(10,1fr)">';
  qs.forEach((q, i) => {
    const userAnswer = state.mcAnswers[i];
    const correct = q.multi
      ? Array.isArray(userAnswer) && userAnswer.length === q.answer.length && [...userAnswer].sort().every((v, j) => v === [...q.answer].sort()[j])
      : userAnswer === q.answer;
    const answered = q.multi ? Array.isArray(userAnswer) && userAnswer.length > 0 : userAnswer !== undefined;
    const cls = answered ? (correct ? 'correct' : 'incorrect') : 'unanswered';
    const userText = q.multi
      ? (Array.isArray(userAnswer) && userAnswer.length ? userAnswer.map(v => LETTERS[v]).join(',') : 'Unanswered')
      : (userAnswer !== undefined ? LETTERS[userAnswer] : 'Unanswered');
    const correctText = q.multi ? q.answer.map(v => LETTERS[v]).join(',') : LETTERS[q.answer];
    const title = answered
      ? (correct ? `Q${i+1}: Correct` : `Q${i+1}: Your answer: ${userText}, Correct: ${correctText}`)
      : `Q${i+1}: Unanswered`;
    mcGrid += `<div class="review-item ${cls}" title="${title}">${i+1}</div>`;
  });
  mcGrid += '</div>';

  return `
  <div class="header">
    <div class="logo"><span>AP</span> ${getExamName()}</div>
    <div class="exam-info">Results</div>
    <div></div>
  </div>
  <div class="results-page main no-sidebar" style="max-width:700px;margin:80px auto 0">
    <h2>Your AP Score</h2>
    <div class="score-circle">
      <div class="big-num">${apScore}</div>
      <div class="label">out of 5</div>
    </div>
    <p style="font-size:18px;color:#666;margin-bottom:8px">${qualLabels[apScore]}</p>
    <p style="font-size:14px;color:#999">${getExamName()} ${getExamYear()}</p>

    <div class="breakdown">
      <h3>Score Breakdown</h3>
      <div class="breakdown-row"><span>Multiple Choice</span><span>${mcCorrect} / ${totalMC} correct (${Math.round(mcCorrect/totalMC*100)}%)</span></div>
      <div class="breakdown-row"><span>MC Weighted Score</span><span>${mcWeighted.toFixed(1)} / ${hasFRQ() ? '53.33' : '80.00'}</span></div>
      ${hasFRQ() ? `<div class="breakdown-row"><span>Free Response</span><span>${frqPoints} / 20 points</span></div><div class="breakdown-row"><span>FRQ Weighted Score</span><span>${frqWeighted.toFixed(1)} / 26.67</span></div>` : ''}
      <div class="breakdown-row"><span>Composite Score</span><span>${composite.toFixed(1)} / 80.00</span></div>
    </div>

    <div class="breakdown">
      <h3>Multiple Choice Detail</h3>
      <div class="legend" style="justify-content:flex-start;margin-bottom:12px">
        <div class="legend-item"><div class="legend-dot" style="background:#e8f5e9;border-color:var(--ap-green)"></div>Correct</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ffebee;border-color:var(--ap-red)"></div>Incorrect</div>
        <div class="legend-item"><div class="legend-dot" style="background:#fff3e0;border-color:var(--ap-orange)"></div>Unanswered</div>
      </div>
      ${mcGrid}
      <p style="font-size:13px;color:#999;margin-top:12px">Hover over a question for details.</p>
    </div>

    <div class="breakdown">
      <h3>AP Score Scale</h3>
      ${[5,4,3,2,1].map(s => {
        const ranges = {5:'60-80',4:'47-59',3:'35-46',2:'25-34',1:'0-24'};
        const active = s === apScore ? 'font-weight:700;color:var(--ap-green)' : 'color:#999';
        return `<div class="breakdown-row" style="${active}"><span>${s} - ${qualLabels[s]}</span><span>${ranges[s]}</span></div>`;
      }).join('')}
    </div>

    <div style="margin-top:32px;display:flex;gap:16px;justify-content:center">
      <button class="btn btn-outline" onclick="location.reload()">Try Another Exam</button>
    </div>
  </div>`;
}

// ===== ACTIONS =====
function selectExam(exam) {
  state = { screen:'mc', exam, currentQ:0, mcAnswers:{}, mcFlags:{}, frqAnswers:{}, frqScores:{}, timerSeconds:0, timerInterval:null, timerRunning:false };
  render();
  startTimer(hasFRQ() ? 70 : 90);
}
function goToQ(i) { state.currentQ = i; render(); }
function nextQ() { if (state.currentQ < getQuestions().length - 1) { state.currentQ++; render(); } }
function prevQ() { if (state.currentQ > 0) { state.currentQ--; render(); } }
function selectAnswer(i) {
  const qs = getQuestions();
  const q = qs[state.currentQ];
  if (q.multi) {
    let current = state.mcAnswers[state.currentQ] || [];
    if (current.includes(i)) {
      current = current.filter(x => x !== i);
    } else {
      if (current.length >= 2) current.shift();
      current.push(i);
    }
    state.mcAnswers[state.currentQ] = current;
  } else {
    state.mcAnswers[state.currentQ] = i;
  }
  render();
}
function toggleFlag() { state.mcFlags[state.currentQ] = !state.mcFlags[state.currentQ]; render(); }
function reviewMC() { state.screen = 'mc-review'; render(); }
function goToFRQ() { stopTimer(); state.screen = 'frq-transition'; state.currentQ = 0; render(); }
function startFRQ() { state.screen = 'frq'; state.currentQ = 0; render(); startTimer(60); }
function goToFRQScoring() { state.screen = 'frq-scoring'; render(); }
function updateFRQTotal() {
  const frqs = getFRQs();
  let total = 0;
  frqs.forEach((frq, fi) => {
    frq.rubric.forEach((r, ri) => {
      if (state.frqScores[`${state.exam}_${fi}_${ri}`]) total += r.pts;
    });
  });
  const el = document.getElementById('frq-total');
  if (el) el.textContent = `FRQ Score: ${total} / 20`;
}
function showResults() { state.screen = 'results'; render(); }

// INIT
render();
</script>
